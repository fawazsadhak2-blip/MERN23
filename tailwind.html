<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            clifford: '#fa373d',
          }
        }
      }
    }
  </script>
</head>
<body>
    <p class="text-[#ff0f] font-[Roboto] text-5[20px] text-right">Hello</p>
    <div class="w-[100px] h-[100px] bg-[#000000]  bg-center pl-[20px] pt-[20px] border-[5px] border-red-600 border-dotted rounded-[20px] m-10 opacity-75 tailwind-eg bg-clifford ">
        <p class="text-white" >Hello</p>
    </div>
</body>
</html>
